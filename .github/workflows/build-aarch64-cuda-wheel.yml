# Build aarch64 (Linux ARM64) PyTorch wheel with CUDA support.
#
# Uses quay.io/pypa/manylinux_2_28_aarch64 (glibc 2.28) as the base image,
# installs CUDA and build dependencies inside the container at runtime,
# then builds PyTorch using the official manywheel pipeline.
#
# Authored with AI assistance.
name: build-aarch64-cuda-wheel

on:
  workflow_dispatch:
    inputs:
      desired_python:
        description: "Python version (e.g. 3.12)"
        required: true
        default: "3.12"
      desired_cuda:
        description: "CUDA variant (cu126, cu130, cu132)"
        required: true
        type: choice
        default: "cu126"
        options:
          - cu126
          - cu130
          - cu132
      max_jobs:
        description: "MAX_JOBS (parallel compile jobs; lower to avoid OOM)"
        required: false
        default: "2"
      swap_size_gb:
        description: "Swap file size in GB (prevents OOM on 16GB runner)"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  resolve-config:
    runs-on: ubuntu-24.04-arm
    outputs:
      base_cuda_version: ${{ steps.cfg.outputs.base_cuda_version }}
      gpu_arch_version: ${{ steps.cfg.outputs.gpu_arch_version }}
      extra_reqs: ${{ steps.cfg.outputs.extra_reqs }}
    steps:
      - id: cfg
        shell: bash
        run: |
          case "${{ inputs.desired_cuda }}" in
            cu126)
              echo "base_cuda_version=12.6" >> "$GITHUB_OUTPUT"
              echo "gpu_arch_version=12.6-aarch64" >> "$GITHUB_OUTPUT"
              echo "extra_reqs=cuda-toolkit[nvrtc,cudart,cupti,cufft,curand,cusolver,cusparse,cublas,cufile,nvtx]==12.6.3; platform_system == 'Linux' | cuda-bindings>=12.9.4,<13; platform_system == 'Linux' and python_version < '3.15' | nvidia-cudnn-cu12==9.10.2.21; platform_system == 'Linux' | nvidia-cusparselt-cu12==0.7.1; platform_system == 'Linux' | nvidia-nccl-cu12==2.29.3; platform_system == 'Linux' | nvidia-nvshmem-cu12==3.4.5; platform_system == 'Linux' | nvidia-nvjitlink-cu12>=12.6.85,<13; platform_system == 'Linux'" >> "$GITHUB_OUTPUT"
              ;;
            cu130)
              echo "base_cuda_version=13.0" >> "$GITHUB_OUTPUT"
              echo "gpu_arch_version=13.0-aarch64" >> "$GITHUB_OUTPUT"
              echo "extra_reqs=cuda-toolkit[nvrtc,cudart,cupti,cufft,curand,cusolver,cusparse,cublas,cufile,nvjitlink,nvtx]==13.0.3; platform_system == 'Linux' | cuda-bindings>=13.0.3,<14; platform_system == 'Linux' and python_version < '3.15' | nvidia-cudnn-cu13==9.24.0.43; platform_system == 'Linux' | nvidia-cusparselt-cu13==0.8.1; platform_system == 'Linux' | nvidia-nccl-cu13==2.30.7; platform_system == 'Linux' | nvidia-nvshmem-cu13==3.4.5; platform_system == 'Linux'" >> "$GITHUB_OUTPUT"
              ;;
            cu132)
              echo "base_cuda_version=13.2" >> "$GITHUB_OUTPUT"
              echo "gpu_arch_version=13.2-aarch64" >> "$GITHUB_OUTPUT"
              echo "extra_reqs=cuda-toolkit[nvrtc,cudart,cupti,cufft,curand,cusolver,cusparse,cublas,cufile,nvjitlink,nvtx]==13.2.0; platform_system == 'Linux' | cuda-bindings>=13.0.3,<14; platform_system == 'Linux' and python_version < '3.15' | nvidia-cudnn-cu13==9.24.0.43; platform_system == 'Linux' | nvidia-cusparselt-cu13==0.8.1; platform_system == 'Linux' | nvidia-nccl-cu13==2.30.7; platform_system == 'Linux' | nvidia-nvshmem-cu13==3.4.5; platform_system == 'Linux'" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: resolve-config
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 420
    env:
      PYTORCH_ROOT: ${{ github.workspace }}
      PACKAGE_TYPE: manywheel
      DESIRED_CUDA: ${{ inputs.desired_cuda }}
      GPU_ARCH_VERSION: ${{ needs.resolve-config.outputs.gpu_arch_version }}
      GPU_ARCH_TYPE: cuda-aarch64
      DOCKER_IMAGE: quay.io/pypa/manylinux_2_28_aarch64
      SKIP_ALL_TESTS: 1
      DESIRED_PYTHON: ${{ inputs.desired_python }}
      MAX_JOBS: ${{ inputs.max_jobs }}
      PYTORCH_EXTRA_INSTALL_REQUIREMENTS: ${{ needs.resolve-config.outputs.extra_reqs }}
      BINARY_ENV_FILE: /tmp/env
      BUILD_ENVIRONMENT: linux-aarch64-binary-manywheel
      ALPINE_IMAGE: arm64v8/alpine
      BASE_CUDA_VERSION: ${{ needs.resolve-config.outputs.base_cuda_version }}
    steps:
      - name: Add swap and free disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/share/chrom* /usr/local/share/edge /usr/local/share/vscode* 2>/dev/null || true
          SWAP_GB=${{ inputs.swap_size_gb }}
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /swapfile1
          sudo fallocate -l "${SWAP_GB}G" /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          echo "--- memory after swap ---"
          free -h
          echo "--- disk after cleanup ---"
          df -h /

      - name: Checkout PyTorch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          show-progress: false

      - name: Checkout upstream Docker config
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          sparse-checkout: .ci/docker
          path: upstream-ci
          show-progress: false

      - name: Pull base image
        shell: bash
        run: docker pull "${DOCKER_IMAGE}"

      - name: Build PyTorch wheel
        shell: bash
        run: |
          set -eux
          export PYTORCH_FINAL_PACKAGE_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PYTORCH_FINAL_PACKAGE_DIR}"
          DOCKER_CTX="${GITHUB_WORKSPACE}/upstream-ci/.ci/docker"

          container_name=$(docker run \
            -e BINARY_ENV_FILE \
            -e BUILD_ENVIRONMENT \
            -e DESIRED_CUDA \
            -e DESIRED_PYTHON \
            -e GITHUB_ACTIONS \
            -e GPU_ARCH_TYPE \
            -e GPU_ARCH_VERSION \
            -e PACKAGE_TYPE \
            -e PYTORCH_FINAL_PACKAGE_DIR \
            -e PYTORCH_ROOT \
            -e SKIP_ALL_TESTS \
            -e PYTORCH_EXTRA_INSTALL_REQUIREMENTS \
            -e DOCKER_IMAGE \
            -e ALPINE_IMAGE \
            -e MAX_JOBS \
            -e BASE_CUDA_VERSION \
            --shm-size=16g \
            --tty \
            --detach \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${PYTORCH_FINAL_PACKAGE_DIR}:${PYTORCH_FINAL_PACKAGE_DIR}" \
            -v "${DOCKER_CTX}:${DOCKER_CTX}" \
            -w / \
            "${DOCKER_IMAGE}")

          docker exec -t "${container_name}" bash -c '
            set -eux
            DEVTOOLSET_VERSION=13

            # Install OS packages (mirror Dockerfile base stage)
            yum -y install epel-release
            yum -y update
            yum install -y \
              autoconf automake bison bzip2 curl diffutils file git make patch perl \
              unzip util-linux wget which xz yasm less zstd libgomp sudo \
              gcc-toolset-${DEVTOOLSET_VERSION}-gcc \
              gcc-toolset-${DEVTOOLSET_VERSION}-gcc-c++ \
              gcc-toolset-${DEVTOOLSET_VERSION}-gcc-gfortran \
              gcc-toolset-${DEVTOOLSET_VERSION}-gdb

            export PATH=/opt/rh/gcc-toolset-${DEVTOOLSET_VERSION}/root/usr/bin:$PATH
            export LD_LIBRARY_PATH=/opt/rh/gcc-toolset-${DEVTOOLSET_VERSION}/root/usr/lib64:/opt/rh/gcc-toolset-${DEVTOOLSET_VERSION}/root/usr/lib:$LD_LIBRARY_PATH

            git config --global --add safe.directory "*"

            # Flatten all install scripts + pin files into one directory,
            # mirroring how the Dockerfile COPYs everything into a single layer.
            SETUP_DIR=/tmp/setup
            mkdir -p "${SETUP_DIR}/ci_commit_pins"
            CTX='"${DOCKER_CTX}"'
            cp "${CTX}/common/"install_cuda.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_nccl.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_cusparselt.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_magma.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_nvpl.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_rust.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_acl.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"install_llvm_tools.sh "${SETUP_DIR}/"
            cp "${CTX}/common/"patch_libstdc.sh "${SETUP_DIR}/"
            cp "${CTX}/ci_commit_pins/"* "${SETUP_DIR}/ci_commit_pins/"

            # Patch NCCL to build serially (-j1) to avoid OOM on 16GB runner
            sed -i "s/make -j src.build/make -j1 src.build/" "${SETUP_DIR}/install_nccl.sh"

            cd "${SETUP_DIR}"

            # Install Rust toolchain
            cp ci_commit_pins/rust.txt ./rust.txt
            bash ./install_rust.sh
            rm -f ./rust.txt

            # Install CUDA, cuDNN, NVSHMEM, NCCL, cuSparseLt
            bash ./install_cuda.sh ${BASE_CUDA_VERSION}

            # Install magma
            bash ./install_magma.sh ${BASE_CUDA_VERSION}

            # Install NVPL BLAS/LAPACK
            bash ./install_nvpl.sh
            cp -r /opt/nvpl/lib/* /usr/local/lib/
            cp -r /opt/nvpl/include/* /usr/local/include/

            # Install Arm Compute Library
            python3.9 -m pip install scons==4.7.0
            ln -sf /opt/python/cp39-cp39/bin/scons /usr/local/bin
            bash ./install_acl.sh

            # Install LLVM BOLT (limit parallelism to avoid OOM)
            MAKEFLAGS="-j2" bash ./install_llvm_tools.sh
            if [ -d /llvm/install ]; then
              cp -r /llvm/install/* /usr/local/ || true
            fi

            # Set up CUDA environment
            ln -sf /usr/local/cuda-${BASE_CUDA_VERSION} /usr/local/cuda
            export PATH=/usr/local/cuda/bin:$PATH
            export LD_LIBRARY_PATH=/acl/build/:$LD_LIBRARY_PATH

            # Patch libstdc++
            bash ./patch_libstdc.sh

            # Clean up
            rm -rf "${SETUP_DIR}" /tmp/* /root/.cache /var/cache/yum 2>/dev/null || true
            echo "--- disk after setup ---"
            df -h /
          '

          echo "--- Container setup complete, starting PyTorch build ---"

          docker exec -t -w "${PYTORCH_ROOT}" "${container_name}" \
            bash -c "git config --global --add safe.directory '${PYTORCH_ROOT}' && bash .ci/pytorch/binary_populate_env.sh"

          docker exec -t -w "${PYTORCH_ROOT}" "${container_name}" \
            bash -c "source '${BINARY_ENV_FILE}' && bash .ci/manywheel/build.sh"

          docker stop "${container_name}" >/dev/null || true

      - name: Upload wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-cuda-${{ inputs.desired_cuda }}-py${{ inputs.desired_python }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/artifacts/*
